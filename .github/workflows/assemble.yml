name: Assemble plugins

# Keeps plugins/ in sync with the source repos and pushes the result
# straight to main. Design notes (post-mortem of the May 2026 drift,
# diagnosed 2026-06-04 — see CLAUDE.md):
#
# - Direct push, no PR: plugins/ is a derived artifact and the lint step
#   is the gate. The PR ceremony required a weekly human merge that
#   never happened on schedule — mise 0.7.3 sat in an unmerged PR for
#   17 days. Green run now MEANS shipped; a red run is the only failure
#   signal, and GitHub emails on scheduled-run failures.
# - A commit to THIS repo is what triggers Desktop/org marketplace
#   re-sync (confirmed by probe 2026-06-04). Source-repo bumps alone are
#   invisible to clients — this workflow's commits are the update bus.
# - Change detection uses `git status --porcelain`, not `git diff`:
#   git diff is blind to new (untracked) files, which silently dropped a
#   week of purely-new-file drift from the June 1 run's detection.
# - Daily, not weekly: propagation latency to every surface IS this cadence.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout batterie
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: batterie

      - name: Checkout source repos (list derived from assemble.sh)
        # Single source of truth: the PLUGINS mapping in assemble.sh. A repo
        # added there is automatically cloned here — the tafelmusik failure
        # mode (mapped but never cloned, silently SKIPped every run) can't
        # recur. batterie-de-savoir is in the mapping too (suite plugin) and
        # doubles as the lint-script source.
        run: |
          repos=$(grep -E '^[a-z-]+:[a-z-]+$' batterie/assemble.sh | cut -d: -f2 | sort -u)
          test -n "$repos"
          for repo in $repos; do
            git clone --depth=1 --quiet "https://github.com/spm1001/$repo.git"
            echo "  OK $repo"
          done

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8
        with:
          version: "latest"

      - name: Materialise mise-home cred (bds-susugu)
        # The planetmodha OAuth client for the private batterie-home output.
        # Secret absent → assemble.sh skips the private half gracefully (its
        # MISE_HOME_CRED gate), so a fork or a secrets-less run stays green.
        env:
          CRED: ${{ secrets.MISE_HOME_CRED_JSON }}
        run: |
          if [ -n "$CRED" ]; then
            printf '%s' "$CRED" > /tmp/mise-home-cred.json
            echo "MISE_HOME_CRED=/tmp/mise-home-cred.json" >> "$GITHUB_ENV"
          else
            echo "MISE_HOME_CRED_JSON secret not set — private output will be skipped"
          fi

      - name: Run assemble.sh
        run: |
          # Default Actions bash has -e but NOT -o pipefail: without it,
          # an assemble.sh failure would vanish into tee's exit 0.
          set -o pipefail
          cd batterie
          chmod +x assemble.sh
          ./assemble.sh | tee /tmp/assemble.log

      - name: Run batterie-lint
        run: |
          cd batterie-de-savoir
          uv run --script scripts/batterie-lint.py --local

      - name: Commit and push if changed
        run: |
          cd batterie
          # --porcelain catches new files too; `git diff --quiet` does not.
          if [ -z "$(git status --porcelain)" ]; then
            # Heartbeat: GitHub auto-disables scheduled workflows after ~60
            # days of repo inactivity. A long drift-free stretch would mean
            # no commits, "inactive" repo, schedule silently killed — and
            # the NEXT drift would never be picked up. If the last commit
            # is >25 days old, commit a heartbeat to keep the schedule
            # alive (and exercise this push path).
            age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
            if [ "$age_days" -le 25 ]; then
              echo "No changes — plugins/ already current (last commit ${age_days}d ago)."
              exit 0
            fi
            echo "No drift, but last commit is ${age_days}d old — heartbeat to keep the schedule alive."
            date -u +%Y-%m-%dT%H:%M:%SZ > .assemble-heartbeat
            git add .assemble-heartbeat
            git -c user.name="github-actions[bot]" \
                -c user.email="github-actions[bot]@users.noreply.github.com" \
                commit -m "Heartbeat — no drift for ${age_days} days; keeping scheduled workflow alive"
            git push origin main
            exit 0
          fi
          echo "Changes detected:"
          git status --porcelain
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "Reassemble — $(date +%Y-%m-%d)

          $(grep -E ' (OK|SKIP|QUARANTINE) ' /tmp/assemble.log)"
          # bds-zofino: two publishes dispatch two assembles seconds apart,
          # and the loser's push used to red the run falsely (2026-07-26,
          # runs 30221858818/30221859322 — created 1s apart, loser failed
          # HERE while the winner had already shipped both payloads). On
          # reject: an identical tree means the twin already shipped this —
          # green, nothing to do; a different tree means ours vendored newer
          # content — re-seat our whole-tree snapshot on the twin's commit
          # (a tree commit can't conflict) and push once more. A second
          # reject stays red: that's a real fault, not a race.
          if ! git push origin main; then
            git fetch origin
            if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'origin/main^{tree}')" ]; then
              echo "Push raced a twin assemble with an IDENTICAL tree — already shipped, nothing to do."
            else
              echo "Push raced a twin assemble — re-seating our newer tree on its commit."
              git reset --soft origin/main
              git -c user.name="github-actions[bot]" \
                  -c user.email="github-actions[bot]@users.noreply.github.com" \
                  commit -m "Reassemble (race recovery) — $(date +%Y-%m-%d)"
              git push origin main
            fi
          fi

      - name: Publish private batterie-home (bds-susugu)
        id: home
        # Pushes the private output to spm1001/batterie-home over a write
        # deploy key. Both marketplaces thus update from the ONE assemble run
        # (bds-nagoru). Runs after the public push (so a private-side failure
        # never blocks the public bus) and before the quarantine-red step (a
        # quarantine day still publishes both, held at last-published).
        # Skips cleanly when the key or the private output is absent — but
        # reports state=skipped so the deadman ping below can starve, turning
        # the silent skip into an alert after period+grace (bds-bidasi).
        env:
          DEPLOY_KEY: ${{ secrets.BATTERIE_HOME_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ] || [ ! -d batterie/dist/batterie-home ]; then
            echo "skip: deploy key or private output missing"
            echo "state=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/batterie_home_deploy
          chmod 600 ~/.ssh/batterie_home_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/batterie_home_deploy -o IdentitiesOnly=yes"
          git clone --depth=1 --quiet git@github.com:spm1001/batterie-home.git /tmp/batterie-home
          rsync -a --delete --exclude .git batterie/dist/batterie-home/ /tmp/batterie-home/
          cd /tmp/batterie-home
          if [ -z "$(git status --porcelain)" ]; then
            echo "batterie-home already current."
            echo "state=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changes detected in private output:"
          git status --porcelain
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "Reassemble batterie-home — $(date +%Y-%m-%d) (from spm1001/batterie ${GITHUB_SHA::7})"
          git push origin main
          echo "state=pushed" >> "$GITHUB_OUTPUT"

      - name: Fail red on any quarantined plugin
        # Runs only after the healthy plugins have been committed and pushed
        # above, so a single laggard never blocks the others (bds-pujaki).
        # The laggard's vendored dir was reverted to last-published in
        # assemble.sh, so the marketplace stays consistent — but the run
        # still goes RED naming it, so a missed version bump can't hide
        # behind a green build (no silent SKIP, the husk lesson).
        run: |
          if [ -s /tmp/assemble-quarantine.txt ]; then
            echo "::error::Version-ratchet quarantine — these plugins drifted without a version bump and were held at their last-published version:"
            sed 's/^/  - /' /tmp/assemble-quarantine.txt
            echo "Healthy plugins published normally. Bump .claude-plugin/plugin.json in each laggard's source repo, then re-run."
            exit 1
          fi
          echo "No quarantined plugins — all assembled plugins published."

      # ---- Deadman pings (bds-bidasi) -------------------------------------
      # Pinged ONLY when the whole run is green (if: success() — so a red run,
      # a quarantine day, or a dead schedule all starve the ping and
      # Healthchecks emails after period 1d + grace 6h). A deadman catches
      # what failure-emails can't: runs that never happen at all (e.g. GitHub
      # auto-disabling the cron after 60 days of repo inactivity).
      # URLs are capability tokens → Actions secrets, never committed.

      - name: Deadman ping — assemble green (bds-bidasi)
        if: success()
        env:
          HC: ${{ secrets.ASSEMBLE_HC_URL }}
        run: |
          if [ -z "$HC" ]; then
            echo "::warning::ASSEMBLE_HC_URL secret not set — assemble deadman is NOT being fed"
            exit 0
          fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$HC" && echo "assemble deadman pinged"

      - name: Deadman ping — batterie-home published (bds-bidasi)
        # Starves when the private-push step skipped (missing deploy key /
        # missing private output), even though that skip keeps the run green —
        # the exact silent-stale mode bds-bidasi exists to catch. "current"
        # counts as healthy: the private marketplace is fresh, nothing to push.
        # Explicit allow-list (not != 'skipped') so an exit path that forgets
        # to set state starves the ping rather than silently feeding it.
        if: success() && (steps.home.outputs.state == 'pushed' || steps.home.outputs.state == 'current')
        env:
          HC: ${{ secrets.BATTERIE_HOME_HC_URL }}
        run: |
          if [ -z "$HC" ]; then
            echo "::warning::BATTERIE_HOME_HC_URL secret not set — batterie-home deadman is NOT being fed"
            exit 0
          fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$HC" && echo "batterie-home deadman pinged"
