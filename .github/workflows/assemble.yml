name: Assemble plugins

# Keeps plugins/ in sync with the source repos and pushes the result
# straight to main. Design notes (post-mortem of the May 2026 drift,
# diagnosed 2026-06-04 — see CLAUDE.md):
#
# - Direct push, no PR: plugins/ is a derived artifact and the lint step
#   is the gate. The PR ceremony required a weekly human merge that
#   never happened on schedule — mise 0.7.3 sat in an unmerged PR for
#   17 days. Green run now MEANS shipped; a red run is the only failure
#   signal, and GitHub emails on scheduled-run failures. Since 2026-09-09
#   a version-ratchet quarantine is no longer red: the run auto-bumps the
#   suite and dispatches a follow-on run (bds-hajeli, last step below).
# - A commit to THIS repo is what triggers Desktop/org marketplace
#   re-sync (confirmed by probe 2026-06-04). Source-repo bumps alone are
#   invisible to clients — this workflow's commits are the update bus.
# - Change detection uses `git status --porcelain`, not `git diff`:
#   git diff is blind to new (untracked) files, which silently dropped a
#   week of purely-new-file drift from the June 1 run's detection.
# - Daily, not weekly: propagation latency to every surface IS this cadence.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC

permissions:
  contents: write
  actions: write   # the auto-bump step dispatches a follow-on run of this workflow (bds-hajeli)

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout batterie
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: batterie

      - name: Checkout source repos (list derived from assemble.sh)
        # Single source of truth: the PLUGINS mapping in assemble.sh. A repo
        # added there is automatically cloned here — the tafelmusik failure
        # mode (mapped but never cloned, silently SKIPped every run) can't
        # recur. batterie-de-savoir is in the mapping too (suite plugin) and
        # doubles as the lint-script source.
        #
        # Private sources clone over SSH with a per-repo deploy key; the rest
        # clone anonymously. The workshop repos went private on 2026-09-23
        # (their handoffs and notes were public), and a private repo cloned
        # anonymously fails here rather than being skipped. A new private
        # source needs a DEPLOY_KEY_<REPO> line below plus its secret.
        env:
          DEPLOY_KEY_BATTERIE_DE_SAVOIR: ${{ secrets.BDS_DEPLOY_KEY }}
          DEPLOY_KEY_TROUSSE: ${{ secrets.TROUSSE_DEPLOY_KEY }}
          DEPLOY_KEY_ARETE: ${{ secrets.ARETE_DEPLOY_KEY }}
          # bds-timule: the CLI sources, private once their wheels ship here.
          DEPLOY_KEY_BON: ${{ secrets.BON_DEPLOY_KEY }}
          DEPLOY_KEY_ACCOMPLIS: ${{ secrets.ACCOMPLIS_DEPLOY_KEY }}
          DEPLOY_KEY_PASSE: ${{ secrets.PASSE_DEPLOY_KEY }}
          DEPLOY_KEY_SONNER: ${{ secrets.SONNER_DEPLOY_KEY }}
          DEPLOY_KEY_DEGLACER: ${{ secrets.DEGLACER_DEPLOY_KEY }}
          DEPLOY_KEY_JETON: ${{ secrets.JETON_DEPLOY_KEY }}   # bds-sipaba
        run: |
          repos=$(grep -E '^[a-z-]+:[a-z-]+$' batterie/assemble.sh | cut -d: -f2 | sort -u)
          test -n "$repos"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          for repo in $repos; do
            var="DEPLOY_KEY_$(printf '%s' "$repo" | tr 'a-z-' 'A-Z_')"
            key="${!var:-}"
            if [ -n "$key" ]; then
              printf '%s\n' "$key" > ~/.ssh/dk_$repo && chmod 600 ~/.ssh/dk_$repo
              GIT_SSH_COMMAND="ssh -i $HOME/.ssh/dk_$repo -o IdentitiesOnly=yes" \
                git clone --depth=1 --quiet "git@github.com:spm1001/$repo.git"
              echo "  OK $repo (deploy key)"
            else
              git clone --depth=1 --quiet "https://github.com/spm1001/$repo.git"
              echo "  OK $repo"
            fi
          done

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8
        with:
          version: "latest"

      - name: Materialise mise-home cred (bds-susugu)
        # The planetmodha OAuth client for the private batterie-home output.
        # Secret absent → assemble.sh skips the private half gracefully (its
        # MISE_HOME_CRED gate), so a fork or a secrets-less run stays green.
        env:
          CRED: ${{ secrets.MISE_HOME_CRED_JSON }}
        run: |
          if [ -n "$CRED" ]; then
            printf '%s' "$CRED" > /tmp/mise-home-cred.json
            echo "MISE_HOME_CRED=/tmp/mise-home-cred.json" >> "$GITHUB_ENV"
          else
            echo "MISE_HOME_CRED_JSON secret not set — private output will be skipped"
          fi

      - name: Run assemble.sh
        run: |
          # Default Actions bash has -e but NOT -o pipefail: without it,
          # an assemble.sh failure would vanish into tee's exit 0.
          set -o pipefail
          cd batterie
          chmod +x assemble.sh
          ./assemble.sh | tee /tmp/assemble.log

      - name: Run batterie-lint
        run: |
          cd batterie-de-savoir
          uv run --script scripts/batterie-lint.py --local

      - name: Commit and push if changed
        run: |
          cd batterie
          # --porcelain catches new files too; `git diff --quiet` does not.
          if [ -z "$(git status --porcelain)" ]; then
            # Heartbeat: GitHub auto-disables scheduled workflows after ~60
            # days of repo inactivity. A long drift-free stretch would mean
            # no commits, "inactive" repo, schedule silently killed — and
            # the NEXT drift would never be picked up. If the last commit
            # is >25 days old, commit a heartbeat to keep the schedule
            # alive (and exercise this push path).
            age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
            if [ "$age_days" -le 25 ]; then
              echo "No changes — plugins/ already current (last commit ${age_days}d ago)."
              exit 0
            fi
            echo "No drift, but last commit is ${age_days}d old — heartbeat to keep the schedule alive."
            date -u +%Y-%m-%dT%H:%M:%SZ > .assemble-heartbeat
            git add .assemble-heartbeat
            git -c user.name="github-actions[bot]" \
                -c user.email="github-actions[bot]@users.noreply.github.com" \
                commit -m "Heartbeat — no drift for ${age_days} days; keeping scheduled workflow alive"
            git push origin main
            exit 0
          fi
          echo "Changes detected:"
          git status --porcelain
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "Reassemble — $(date +%Y-%m-%d)

          $(grep -E ' (OK|SKIP|QUARANTINE) ' /tmp/assemble.log)"
          # bds-zofino: two publishes dispatch two assembles seconds apart,
          # and the loser's push used to red the run falsely (2026-07-26,
          # runs 30221858818/30221859322 — created 1s apart, loser failed
          # HERE while the winner had already shipped both payloads). On
          # reject: an identical tree means the twin already shipped this —
          # green, nothing to do; a different tree means ours vendored newer
          # content — re-seat our whole-tree snapshot on the twin's commit
          # (a tree commit can't conflict) and push once more. A second
          # reject stays red: that's a real fault, not a race.
          if ! git push origin main; then
            git fetch origin
            if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'origin/main^{tree}')" ]; then
              echo "Push raced a twin assemble with an IDENTICAL tree — already shipped, nothing to do."
            else
              echo "Push raced a twin assemble — re-seating our newer tree on its commit."
              git reset --soft origin/main
              git -c user.name="github-actions[bot]" \
                  -c user.email="github-actions[bot]@users.noreply.github.com" \
                  commit -m "Reassemble (race recovery) — $(date +%Y-%m-%d)"
              git push origin main
            fi
          fi

      - name: Publish private batterie-home (bds-susugu)
        id: home
        # Pushes the private output to spm1001/batterie-home over a write
        # deploy key. Both marketplaces thus update from the ONE assemble run
        # (bds-nagoru). Runs after the public push (so a private-side failure
        # never blocks the public bus) and before the quarantine-red step (a
        # quarantine day still publishes both, held at last-published).
        # Skips cleanly when the key or the private output is absent — but
        # reports state=skipped so the deadman ping below can starve, turning
        # the silent skip into an alert after period+grace (bds-bidasi).
        env:
          DEPLOY_KEY: ${{ secrets.BATTERIE_HOME_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ] || [ ! -d batterie/dist/batterie-home ]; then
            echo "skip: deploy key or private output missing"
            echo "state=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/batterie_home_deploy
          chmod 600 ~/.ssh/batterie_home_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/batterie_home_deploy -o IdentitiesOnly=yes"
          git clone --depth=1 --quiet git@github.com:spm1001/batterie-home.git /tmp/batterie-home
          rsync -a --delete --exclude .git batterie/dist/batterie-home/ /tmp/batterie-home/
          cd /tmp/batterie-home
          if [ -z "$(git status --porcelain)" ]; then
            echo "batterie-home already current."
            echo "state=current" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changes detected in private output:"
          git status --porcelain
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "Reassemble batterie-home — $(date +%Y-%m-%d) (from spm1001/batterie ${GITHUB_SHA::7})"
          git push origin main
          echo "state=pushed" >> "$GITHUB_OUTPUT"

      - name: Auto-bump the suite on quarantine (bds-hajeli)
        # Runs only after the healthy plugins have been committed and pushed
        # above, so a single laggard never blocks the others (bds-pujaki).
        # The laggard's vendored dir was reverted to last-published in
        # assemble.sh, so the marketplace stays consistent for THIS run.
        #
        # Until 2026-09-09 this step went RED naming the laggards and asked a
        # human to bump. Measured: the run was red every day from 2 to 8 Sep
        # (trousse, then bon, mise and sonner too) and nobody acted on seven
        # emails — the drift shipped only because an unrelated publish
        # re-stamped everything. The ratchet's purpose is "never ship changed
        # content under an unchanged version"; it never needed a human to do
        # the bump, only for the bump to happen. So: bump the SUITE patch
        # version in batterie-de-savoir with publish.py (the same engine
        # /batterie:publish uses — one combined plugin.json+CHANGELOG commit,
        # twin-publish race recovery included), push it over a write deploy
        # key, and dispatch a follow-on run of this workflow, which sees the
        # new suite version and publishes the laggards. No loop: the bump
        # commit touches only plugin.json (version-filtered) and CHANGELOG.md
        # (not vendored), so the follow-on run finds no drift unless a fresh
        # push landed in between — and then it simply bumps once more.
        # publish.py's --no-wait skips the run watch; --no-pull skips the
        # local-machine pull; both are meaningless in CI.
        # RED is reserved for a real fault: no deploy key, or the bump itself
        # failing — in which case the old message and the old advice stand.
        env:
          DEPLOY_KEY: ${{ secrets.BDS_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s /tmp/assemble-quarantine.txt ]; then
            echo "No quarantined plugins — all assembled plugins published."
            exit 0
          fi
          echo "Version-ratchet quarantine — these plugins drifted without a suite bump and were held at their last-published version this run:"
          sed 's/^/  - /' /tmp/assemble-quarantine.txt
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::BDS_DEPLOY_KEY secret is missing, so the suite cannot be auto-bumped. Ship the drift with /batterie:publish (or restore the secret) and re-run."
            exit 1
          fi
          # One changelog line naming each laggard and the subject of its newest
          # source commit — the auto-generated stand-in for the human narrative
          # a hand publish carries. The plugin→repo map is assemble.sh's PLUGINS
          # block, the same single source the clone step reads.
          parts=""
          while IFS= read -r plugin; do
            [ -n "$plugin" ] || continue
            repo=$(grep -E '^[a-z-]+:[a-z-]+$' batterie/assemble.sh | awk -F: -v p="$plugin" '$1==p{print $2; exit}')
            subj=$(git -C "$repo" log -1 --format=%s 2>/dev/null || echo "?")
            parts="${parts}${parts:+; }${plugin}: ${subj}"
          done < /tmp/assemble-quarantine.txt
          laggards=$(paste -sd, /tmp/assemble-quarantine.txt)
          changelog="Auto-bump by the daily assembler (bds-hajeli): content drifted without a publish — ${parts}"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/bds_deploy
          chmod 600 ~/.ssh/bds_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/bds_deploy -o IdentitiesOnly=yes"
          cd batterie-de-savoir
          git remote set-url origin git@github.com:spm1001/batterie-de-savoir.git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # publish.py stages with `git add -u` in the suite repo: this checkout
          # must be clean apart from the bump it writes. Say so if it isn't.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::batterie-de-savoir checkout is not clean before the auto-bump:"
            git status --porcelain
          fi
          uv run --script scripts/publish.py --patch --no-wait --no-pull \
            -m "chore(batterie): auto-bump suite for drift in ${laggards} (bds-hajeli)" \
            --changelog "$changelog"
          echo "::notice::Auto-bumped the suite for drift in ${laggards}; a follow-on assemble run was dispatched to publish them at the new version."

      # ---- Deadman pings: RETIRED 2026-09-11 -------------------------------
      # The two Healthchecks checks this workflow fed (batterie-assemble,
      # batterie-home-publish; bds-bidasi) were folded into tube's daily
      # estate-sweep when the roster was consolidated 20 -> 9. The sweep reads
      # this workflow's runs directly (red on main with age; a scheduled
      # workflow silent for >3 days), so the pings became a second copy of one
      # fact. Secrets ASSEMBLE_HC_URL / BATTERIE_HOME_HC_URL were deleted the
      # same day. History of the steps: git log -S bds-bidasi.

  # ---- Install smoke (bds-dekava, 2026-09-23) ------------------------------
  # Installs every plugin from the marketplace the assemble job just pushed, in
  # a throwaway config, the way a teammate's CLI would: catches a manifest the
  # current Claude Code rejects — a malformed plugin.json or marketplace.json,
  # a declared plugin that will not install — which the husk and parity guards
  # cannot see. Measured 2026-09-23: a plugin.json with "hooks": 42 goes red;
  # a duplicate hooks declaration does NOT (it only bites at session load), so
  # that class stays with batterie-lint's check (bds-nukeca).
  # A separate job on purpose: it runs the latest @anthropic-ai/claude-code
  # from npm, so it gets read-only permissions and none of the deploy keys or
  # the planetmodha cred. It runs after the push, so it detects rather than
  # prevents — a red here means the live marketplace needs a look. It cannot
  # fire SessionStart hooks (no session), so CLI installs are not covered.
  install-smoke:
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the assembled marketplace
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Every plugin installs, enables and validates
        run: |
          export HOME="$RUNNER_TEMP/home" CLAUDE_CONFIG_DIR="$RUNNER_TEMP/home/cfg"
          mkdir -p "$CLAUDE_CONFIG_DIR"
          claude --version
          claude plugin validate "$GITHUB_WORKSPACE"
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          mp=$(python3 -c "import json; print(json.load(open('.claude-plugin/marketplace.json'))['name'])")
          names=$(python3 -c "import json; print(' '.join(p['name'] for p in json.load(open('.claude-plugin/marketplace.json'))['plugins']))")
          test -n "$names"
          fail=0
          for n in $names; do
            claude plugin validate "plugins/$n" > /dev/null || { echo "::error::plugin validate failed: $n"; fail=1; }
            claude plugin install "$n@$mp" || { echo "::error::install failed: $n@$mp"; fail=1; }
          done
          claude plugin list --json > "$RUNNER_TEMP/list.json"
          python3 - "$RUNNER_TEMP/list.json" "$mp" $names <<'PYEOF' || fail=1
          import json, sys
          listed, mp, names = sys.argv[1], sys.argv[2], sys.argv[3:]
          enabled = {p["id"] for p in json.load(open(listed)) if p.get("enabled")}
          missing = [n for n in names if f"{n}@{mp}" not in enabled]
          for n in missing:
              print(f"::error::{n}@{mp} is not installed and enabled")
          print(f"{len(names) - len(missing)}/{len(names)} plugins installed and enabled")
          sys.exit(1 if missing else 0)
          PYEOF
          exit $fail
